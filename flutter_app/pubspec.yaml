name: onionsetu
description: OnionSetu — Flutter offline-first onion grading (YOLOv8 Nano + MobileNetV2 + OpenCV + SQLite + Supabase sync)
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ">=3.0.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  camera: ^0.10.5
  sqflite: ^2.3.0
  tflite_flutter: ^0.10.1
  opencv_4: ^1.0.0
  provider: ^6.1.0
  http: ^1.1.0
  crypto: ^3.0.3
  path_provider: ^2.1.1
  qr_flutter: ^4.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/models/yolov8n.onion.tflite
    - assets/models/mobilenetv2_defect.tflite
